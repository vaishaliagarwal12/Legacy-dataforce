name: CI & Quality Assurance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    name: Code Quality (Ruff & Black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Black Code Formatter Check
        run: |
          black --check .

  test-suite:
    name: Automated Testing Suite
    runs-on: ubuntu-latest
    needs: lint-and-format

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_root_password
          MYSQL_DATABASE: placement_test_db
          MYSQL_USER: ci_test_user
          MYSQL_PASSWORD: ci_test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      FLASK_ENV: testing
      SECRET_KEY: ci_ephemeral_secret_key_for_testing_only_32bytes_long
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_test_root_password
      MYSQL_DB: placement_test_db
      MYSQL_TEST_DB: placement_test_db
      MYSQL_READONLY_USER: ci_test_user
      MYSQL_READONLY_PASSWORD: ci_test_password
      CSRF_ENABLED: 0

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Isolated MySQL Test Schema and Seed Data
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -pci_test_root_password placement_test_db < schema.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci_test_root_password placement_test_db < seed.sql
          mysql -h 127.0.0.1 -P 3306 -u root -pci_test_root_password placement_test_db -e "GRANT SELECT ON placement_test_db.* TO 'ci_test_user'@'%'; FLUSH PRIVILEGES;"

      - name: Run Pytest Test Suite
        run: |
          pytest -v --tb=short
