[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Test", "*TestCase"]
python_functions = ["test_*"]
pythonpath = ["."]
norecursedirs = ["scratch", ".venv", ".git", "build", "dist"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
addopts = "-v --strict-markers"

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    \.git
  | \.venv
  | scratch
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".venv",
    "scratch",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # Line length (handled by Black)
    "W291",  # Trailing whitespace
    "W293",  # Blank line whitespace
    "E402",  # Module level import not at top of file (Flask blueprint pattern)
    "F841",  # Local variable assigned but unused
]

[tool.ruff.lint.per-file-ignores]
"routes/__init__.py" = ["F401"]
"services/__init__.py" = ["F401"]
"tests/*" = ["F401", "F841"]
